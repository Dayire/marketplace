x-backend: &backend
  build:
    context: .
    dockerfile: services/marketplace-backend/Dockerfile
  env_file: .env.backend
  volumes:
    - marketplace-data:/data
  restart: unless-stopped
services:
  api:
    <<: *backend
    ports: ["127.0.0.1:3100:3100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  indexer:
    <<: *backend
    command: ["node", "services/marketplace-backend/src/worker.mjs", "index"]
  metadata:
    <<: *backend
    command: ["node", "services/marketplace-backend/src/worker.mjs", "metadata"]
  discovery:
    <<: *backend
    command: ["node", "services/marketplace-backend/src/worker.mjs", "discover"]
volumes:
  marketplace-data:
